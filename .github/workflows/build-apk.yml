name: Build Amir Flow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Standard Flutter Project and Overwrite
        run: |
          # 1. ساخت پروژه استاندارد
          flutter create temp_project
          
          # 2. کپی کردن فایل‌های ما
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          
          # 3. رفتن به پوشه پروژه
          cd temp_project
          
          # 4. ارتقای نسخه Kotlin به صورت خودکار و استاندارد
          # این دستور از ابزار Gradle استفاده می‌کنه تا فایل رو بدون خرابی آپدیت کنه
          flutter build apk --release --no-tree-shake-icons
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amir-flow-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
