name: Build Amir Flow APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Standard Flutter Project and Overwrite
        run: |
          # ساخت یک پروژه استاندارد در یک پوشه موقت
          flutter create temp_project
          # کپی کردن فایل‌های کدهای ما به داخل پروژه استاندارد
          cp lib/main.dart temp_project/lib/main.dart
          cp pubspec.yaml temp_project/pubspec.yaml
          # رفتن به پوشه پروژه استاندارد
          cd temp_project
          # گرفتن پکیج‌ها و بیلد گرفتن
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amir-flow-apk
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
